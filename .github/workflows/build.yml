name: Compilar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Sin clave de firma: se compila de prueba y no se publica."
          fi
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 2 ))" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk desintoxicacion-digital.apk

      - uses: actions/upload-artifact@v4
        with:
          name: desintoxicacion-digital
          path: desintoxicacion-digital.apk

      - name: Publicar versión
        if: env.KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_CODE" desintoxicacion-digital.apk \
            --title "Versión $VERSION_CODE" \
            --notes "${{ github.event.head_commit.message }}" \
            --latest
